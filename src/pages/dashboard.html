<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>딸깍 - 대시보드</title>
  <link rel="icon" href="../../assets/icons/favicon.ico">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <header>
    <a class="brand" href="../../index.html"> <!-- 로고 + "딸깍" (소개 페이지로 이동) -->
      <img id="brand-logo" src="../../assets/icons/logo-mono.svg" alt="로고">
      <div id="brand-name">딸깍</div>
    </a>
    <nav class="toolbar-actions"> <!-- 새 프로젝트 -->
      <a class="toolbar-btn" data-action="new-project" href="workspace.html"><img class="btn-icon" src="../../assets/icons/plus.svg" alt="새 프로젝트">새 프로젝트</a>
    </nav>
  </header>
  <hr id="header-divider">
  <main>
    <section class="profile"> <!-- 사용자 간략 정보 (v2, 삭제될 수 있음) -->
      <input type="file" id="imageInput" accept="image/*">
      <div class="avatar-control">
        <label class="avatar-upload" for="imageInput" title="프로필 사진 변경">
          <img class="profile-avatar" alt="프로필 사진">
          <img class="camera" src="/assets/icons/camera.png" alt="">
        </label>
        <button class="avatar-remove" id="removeAvatar" type="button" aria-label="프로필 사진 삭제" title="프로필 사진 삭제" hidden>×</button>
      </div>
      <input id="profile-name" type="text" name="profileName" placeholder="이름을 입력해주세요"> <!-- 사용자 이름 -->
      <ul class="profile-stats">
        <li class="stat">
          <span class="stat-value" data-stat="days">-</span>
          <span class="stat-label">함께한 날</span>
        </li>
        <li class="stat">
          <span class="stat-value" data-stat="projects">-</span>
          <span class="stat-label">프로젝트</span>
        </li>
        <li class="stat">
          <span class="stat-value" data-stat="last-edited">-</span>
          <span class="stat-label">마지막 작업</span>
        </li>
      </ul>
    </section>

    <section class="gallery" aria-label="프로젝트 목록"></section>
  </main>
  <script type="module" src="../js/util/profile.js"></script>
  <script type="module" src="../js/util/gallery.js"></script>
</body>
</html>

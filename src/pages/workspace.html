<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>딸깍 - 워크스페이스</title>
    <link rel="icon" href="../../assets/icons/favicon.ico" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/palette.css" />
    <link rel="stylesheet" href="../css/attributes.css" />
    <link rel="stylesheet" href="../css/canvas.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="../../index.html">
        <!-- 로고 + "딸깍" (소개 페이지로 이동) -->
        <img
          id="brand-logo"
          src="../../assets/icons/logo-mono.svg"
          alt="로고"
        />
        <div id="brand-name">딸깍</div>
      </a>
      <div class="top-divider" aria-hidden="true"></div>
      <!-- 로고와 입력 필드 사이 구분선 -->
      <input
        id="project-name"
        type="text"
        name="projectName"
        placeholder="프로젝트 이름을 입력해주세요"
      />
      <!-- 프로젝트 이름 -->
      <div class="toolbar-actions">
        <button class="toolbar-btn" data-action="new-tab">
          <img
            class="btn-icon"
            src="../../assets/icons/new-tab.svg"
            alt="새 탭"
          />새 탭
        </button>
        <button class="toolbar-btn" data-action="export">
          <img
            class="btn-icon"
            src="../../assets/icons/export.svg"
            alt="내보내기"
          />내보내기
        </button>

        <details class="toolbar-menu">
          <!-- 저장 / 불러오기 / 초기화는 메뉴 안에 -->
          <summary class="toolbar-btn toolbar-menu-button" aria-label="메뉴 더 보기">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </summary>
          <div class="toolbar-menu-list">
            <button class="toolbar-menu-item" type="button" data-action="save">
              <img src="../../assets/icons/save.svg" alt="" />저장
            </button>
            <button class="toolbar-menu-item" type="button" data-action="load">
              <img src="../../assets/icons/load.svg" alt="" />불러오기
            </button>
            <button class="toolbar-menu-item" type="button" data-action="reset">
              <img src="../../assets/icons/reset.svg" alt="" />초기화
            </button>
          </div>
        </details>

        <a
          class="toolbar-btn"
          data-action="dashboard"
          href="./dashboard.html"
          title="대시보드로 이동합니다."
        >
          <img class="btn-icon" src="../../assets/icons/dashboard.svg" alt="" />대시보드
        </a>
      </div>
    </header>
    <hr id="header-divider" />
    <main>
      <section class="controls">
        <!-- 태그 선택 / 속성 편집 / 제작 영역 -->
        <aside class="tag-list">
          <!-- html 태그 종류 (좌측 목록) -->
          <div class="tag-category"></div>
          <div class="tag-chip"></div>
        </aside>

        <section class="workspace">
          <!-- 속성 편집 & 태그 제작 -->
          <div class="attr-panel"></div>
          <div class="preview-make">
            <!-- 태그 미리보기 및 제작 영역 -->
            <div class="tag-preview"></div>
            <button type="button" class="make-action">제작</button>
          </div>
        </section>
      </section>

      <section class="output">
        <!-- 결과 확인 영역 -->
        <div class="render-pane">
          <iframe id="html-preview" src="about:blank"></iframe>
        </div>
        <div class="splitter"></div>
        <div class="code-pane">
          <button class="pane-btn" type="button" data-action="copy-code">
            복사
          </button>

          <!-- 코드 창 전체 -->
          <div class="code-window">
            <!-- 실제 스크롤 영역 -->
            <div class="code-editor">
              <div id="line-numbers"></div>
              <pre data-selectable="true"><code id="code-output"></code></pre>
            </div>

            <!-- 코드 창 중앙에 표시되는 메시지 -->
            <div id="copy-message"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="../js/header.js"></script>
    <script type="module" src="../js/util/codeGenerator.js"></script>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/util/splitter.js"></script>
    <script type="module" src="../js/util/profile.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>딸깍 - 워크스페이스</title>
    <link rel="icon" href="../../assets/icons/favicon.ico" />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/palette.css" />
    <link rel="stylesheet" href="../css/attributes.css" />
    <link rel="stylesheet" href="../css/canvas.css" />
  </head>
  <body class="workspace-page">
    <header>
      <div class="header-identity">
        <a class="brand" href="../../index.html" aria-label="딸깍 소개 페이지">
          <img id="brand-logo" src="../../assets/icons/logo-mono.svg" alt="" />
          <span id="brand-name">딸깍</span>
        </a>
        <div class="top-divider" aria-hidden="true"></div>
        <input
          id="project-name"
          type="text"
          name="projectName"
          placeholder="프로젝트 이름을 입력해주세요"
          aria-label="프로젝트 이름"
          maxlength="80"
        />
      </div>

      <nav class="toolbar-actions" aria-label="프로젝트 메뉴">
        <button class="toolbar-btn" type="button" data-action="preview">
          <img class="btn-icon" src="../../assets/icons/new-tab.svg" alt="" />
          <span>미리보기</span>
        </button>
        <button class="toolbar-btn" type="button" data-action="export">
          <img class="btn-icon" src="../../assets/icons/export.svg" alt="" />
          <span>내보내기</span>
        </button>
        <a class="toolbar-btn dashboard-link" href="dashboard.html">
          <img class="btn-icon" src="../../assets/icons/dashboard.svg" alt="" />
          <span>대시보드로 돌아가기</span>
        </a>
        <div class="menu-wrap">
          <button
            class="toolbar-btn menu-toggle"
            type="button"
            data-action="menu-toggle"
            aria-label="프로젝트 메뉴 열기"
            aria-expanded="false"
            aria-controls="project-menu"
          >
            <span class="hamburger-icon" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
          <div id="project-menu" class="project-menu" hidden>
            <button type="button" data-action="save">저장</button>
            <button type="button" data-action="load">불러오기</button>
            <div class="menu-separator" aria-hidden="true"></div>
            <button type="button" class="menu-item-danger" data-action="reset">초기화</button>
          </div>
        </div>
      </nav>
    </header>
    <hr id="header-divider" />

    <main>
      <section class="controls" aria-label="태그 작업 영역">
        <aside class="tag-list" aria-label="HTML 태그 선택">
          <div class="tag-category" aria-label="태그 종류"></div>
          <div class="tag-chip" aria-label="태그 목록"></div>
        </aside>

        <section class="workspace" aria-label="태그 편집 및 미리보기">
          <section class="attr-panel" data-drop-target="tag-select" aria-label="속성 편집"></section>
          <section class="preview-make" aria-label="태그 미리보기">
            <div class="panel-heading">태그 미리보기</div>
            <div class="tag-preview" data-drop-target="tag-select" aria-live="polite"></div>
            <button type="button" class="make-action">제작</button>
          </section>
        </section>
      </section>

      <section class="output" aria-label="HTML 결과">
        <section class="render-pane" aria-label="렌더링 결과">
          <iframe id="html-preview" title="생성한 HTML 미리보기" sandbox="" src="about:blank"></iframe>
        </section>
        <div class="splitter" role="separator" aria-label="미리보기와 코드 영역 크기 조절" aria-orientation="vertical" tabindex="0"></div>
        <section class="code-pane" aria-label="HTML 코드">
          <button class="pane-btn" type="button" data-action="copy-code">복사</button>
          <div class="code-window">
            <div class="code-editor">
              <div id="line-numbers" aria-hidden="true"></div>
              <pre><code id="code-output"></code></pre>
            </div>
            <div id="copy-message" role="status" aria-live="polite"></div>
          </div>
        </section>
      </section>
    </main>

    <dialog id="load-project-dialog" aria-labelledby="load-dialog-title">
      <div class="dialog-content">
        <h2 id="load-dialog-title">저장한 프로젝트 불러오기</h2>
        <label for="saved-projects">프로젝트</label>
        <select id="saved-projects"></select>
        <p id="load-empty-message" hidden>저장된 프로젝트가 없습니다.</p>
        <div class="dialog-actions">
          <button type="button" data-action="load-cancel">취소</button>
          <button type="button" class="dialog-primary" data-action="load-confirm">불러오기</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="../js/header.js"></script>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/util/splitter.js"></script>
    <script type="module" src="../js/util/profile.js"></script>
  </body>
</html>
